{% extends "base.html" %}{% block content %}<section class="panel narrow"><div class="eyebrow">AUTHENTICATION // SECURE GATE</div>
{% if mode == "register" %}<h2>CREATE ACCOUNT</h2><form method="post"><label>USERNAME</label><input name="username" required maxlength="32" placeholder="your_username"><label>GMAIL / EMAIL</label><input name="email" type="email" required><label>PASSWORD (MIN 8 CHARACTERS)</label><input name="password" type="password" minlength="8" required><button class="btn primary">REGISTER</button></form><p>Already registered? <a href="/login">Login</a></p>
{% elif mode == "forgot" %}<h2>RESET PASSWORD</h2><form method="post"><label>ACCOUNT EMAIL</label><input name="email" type="email" required><button class="btn primary">SEND RESET LINK</button></form><p><a href="/login">Back to login</a></p>
{% else %}<h2>WELCOME BACK</h2><form method="post"><label>EMAIL</label><input name="email" type="email" required><label>PASSWORD</label><input name="password" type="password" required><button class="btn primary">LOGIN</button></form><p><a href="/forgot">Forgot password?</a> · <a href="/register">Create account</a></p>{% endif %}</section>{% endblock %}
